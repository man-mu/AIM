server:
  port: 9080  # 避免 nacos 3.x console 端口 8080 冲突

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:dev}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        group: ${NACOS_GROUP:AIM_GROUP}
        file-extension: yml
      discovery:
        group: ${NACOS_GROUP:AIM_GROUP}
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
        - id: conv-service
          uri: lb://conv-service
          predicates:
            - Path=/api/v1/convs/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/v1/files/**
  config:
    import:
      - optional:nacos:gateway-service.yml
      - optional:nacos:application.yml?group=COMMON_GROUP
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:aim-jwt-secret-key-change-in-production}
