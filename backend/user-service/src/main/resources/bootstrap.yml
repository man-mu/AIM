# Bootstrap 配置：启动早期拉取 Nacos 配置，仅含 Nacos 连接信息
# 真正的业务配置放在 Nacos 配置中心对应 namespace/DataId 下
spring:
  application:
    name: user-service
  cloud:
    nacos:
      # 公共连接属性，config / discovery 模块自动继承
      server-addr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:dev}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      # 注意 group 不能放公共层（discovery 默认 DEFAULT_GROUP，config 才用 AIM_GROUP）
      config:
        group: ${NACOS_GROUP:AIM_GROUP}
        file-extension: yml
        shared-configs:
          - data-id: application.yml
            group: COMMON_GROUP
            refresh: true
      discovery:
        group: ${NACOS_GROUP:AIM_GROUP}