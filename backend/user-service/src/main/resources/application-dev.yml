spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/aim?currentSchema=%22user%22&stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:aim-jwt-secret-key-change-in-production}
  expire-sec: 7200
  refresh-sec: 2592000
