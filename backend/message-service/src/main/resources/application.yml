# application.yml
# 1) Nacos 连接属性 + 触发拉取  2) 最小兜底
# 业务配置（数据源、Redis、Kafka、Dubbo、雪花算法等）全部在 Nacos 配置中心对应 namespace 的 message-service.yml DataId 下
# message-service 同时暴露 HTTP（8085，供 gateway 转发）+ Dubbo Provider（20884，供其他业务服务 RPC 调用）
spring:
  application:
    name: message-service
  cloud:
    nacos:
      # 公共连接属性，config / discovery 模块自动继承
      server-addr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:dev}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      # group 不能放公共层（discovery 默认 DEFAULT_GROUP，config 才用 AIM_GROUP）
      config:
        group: ${NACOS_GROUP:AIM_GROUP}
        file-extension: yml
      discovery:
        group: ${NACOS_GROUP:AIM_GROUP}
  config:
    import:
      # optional: 表示 Nacos 不可达时不阻塞启动（走兜底）
      # 第二条拉共享公共配置
      - optional:nacos:message-service.yml
      - optional:nacos:application.yml?group=COMMON_GROUP
  jackson:
    serialization:
      write-bigdecimal-as-plain: true

server:
  port: ${SERVER_PORT:8085}
  forward-headers-strategy: framework

dubbo:
  qos:
    enable: false  # 禁用 QoS 运维端口（22222），避免多服务同主机启动时端口冲突

