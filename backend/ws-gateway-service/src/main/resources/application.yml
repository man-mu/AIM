# application.yml
# 1) Nacos 连接属性 + 触发拉取  2) 最小兜底
# 业务配置（Dubbo、WebSocket 端口等）全部在 Nacos 配置中心对应 namespace 的 ws-gateway-service.yml DataId 下
# ws-gateway-service 为 Netty WebSocket 长连接网关，监听 aim.websocket.port（非 Spring 内嵌 Web 容器，故无 server.port）
spring:
  application:
    name: ws-gateway-service
  cloud:
    nacos:
      # 公共连接属性，config / discovery 模块自动继承
      server-addr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:dev}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      # group 不能放公共层（discovery 默认 DEFAULT_GROUP，config 才用 AIM_GROUP）
      config:
        group: ${NACOS_GROUP:AIM_GROUP}
        file-extension: yml
      discovery:
        group: ${NACOS_GROUP:AIM_GROUP}
  config:
    import:
      # optional: 表示 Nacos 不可达时不阻塞启动（走兜底）
      # 第二条拉共享公共配置
      - optional:nacos:ws-gateway-service.yml
      - optional:nacos:application.yml?group=COMMON_GROUP
  jackson:
    serialization:
      write-bigdecimal-as-plain: true

aim:
  websocket:
    port: ${WS_PORT:8081}

dubbo:
  qos:
    enable: false  # 禁用 QoS 运维端口（22222），避免多服务同主机启动时端口冲突

# ============================================================
# 以下为 Nacos DataId（ws-gateway-service.yml，AIM_GROUP）应包含的业务配置模板
# ws-gateway-service 无数据库、无 Redis，仅 Dubbo（接收 signaling 推送）+ WebSocket 端口
# 敏感值用占位符，由环境变量注入；dev namespace bake 了 localhost 默认值
# 本段为注释（不生效），仅作 Nacos 配置录入参考；实际值在 Nacos 配置中心维护
# ============================================================
# dubbo:
#   application:
#     name: ws-gateway-service
#   protocol:
#     name: dubbo
#     port: 20880
#   registry:
#     # registry 地址必须带鉴权（user:pass@host?namespace&group），否则 Dubbo 匿名访问 Nacos OpenAPI 被 401 拒绝
#     address: nacos://${NACOS_USERNAME:nacos}:${NACOS_PASSWORD:nacos}@${NACOS_ADDR:localhost:8848}?namespace=${NACOS_NAMESPACE:dev}&group=${NACOS_GROUP:AIM_GROUP}
